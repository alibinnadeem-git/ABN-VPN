#cloud-config
package_update: true
packages:
  - wireguard
  - qrencode
  - ufw
write_files:
  - path: /etc/sysctl.d/99-abn-vpn.conf
    permissions: '0644'
    content: |
      net.ipv4.ip_forward=1
runcmd:
  - sysctl --system
  - ufw allow OpenSSH
  - ufw allow 51820/udp
  - ufw --force enable
final_message: "ABN VPN base packages installed. Run bootstrap-first-node.sh with the VM public IP/DNS name."
