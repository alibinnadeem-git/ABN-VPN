name: Smoke
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: bash -n infra/oracle-cloud/init-wireguard.sh
      - run: bash -n infra/oracle-cloud/add-client.sh
      - run: bash -n infra/oracle-cloud/remove-client.sh
      - run: bash -n infra/oracle-cloud/healthcheck.sh
